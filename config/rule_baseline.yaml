# =============================================================================
# RULE / KEYWORD BASELINE
# =============================================================================
# DELIBERATELY A DIFFERENT SUBSTRATE FROM THE LABELLING ENGINE.
#   config/ir35_weights.yaml scores STRUCTURED ANSWERS to produce the status
#   label. This baseline reads FREE TEXT and compares it against the answer's
#   polarity. They share no logic and no coefficients. That separation is what
#   stops Phase 2 grading the generator against itself — see the caveat at the
#   top of ir35_weights.yaml.
#
# HONEST ATTEMPT, NOT A STRAWMAN.
#   The point of the comparison is to find out where a lexical method actually
#   fails, so this baseline gets the things a competent analyst would build:
#   negation handling, family-level lexicons that generalise beyond the per-pair
#   cue lists, regex for rate structures, and priority weighting for the pairs
#   where a miss costs most. If the transformer cannot beat this, that is a
#   finding worth reporting rather than a result to engineer away.
#
# CUE LEAKAGE.
#   The family lexicons below were written after the Phase 1 text bank existed,
#   so they carry the same contamination risk as the Phase 0 pair cues. The
#   de-leaking procedure in src/evaluate/leakage.py is applied to BOTH, and the
#   baseline is reported as a bounded range rather than a single number.
# =============================================================================

rule_baseline_version: "0.1.0"

scoring:
  # Weighted evidence, squashed through a logistic. Interpretable by design: a
  # reviewer can be told exactly which phrases fired.
  weights:
    pair_cue: 1.30          # a cue authored for this specific pair
    family_lexicon: 0.95    # a cross-cutting contradiction-family term
    regex: 1.10             # structural patterns, e.g. a day rate
    negation_penalty: 1.40  # a matched cue that turns out to be negated
  offset: 1.55              # subtracted before the logistic; sets the base rate
  # High-priority pairs get a lower effective bar, because a missed
  # contradiction on substitution or payment basis flips a determination while a
  # missed one on 4.25 rarely does. Optimising for recall means spending the
  # false-positive budget where the stakes are.
  priority_boost: 0.45
  max_score: 0.99

# -----------------------------------------------------------------------------
# NEGATION
# A naive keyword matcher fires on "we do NOT require them on site". Any cue
# preceded by a negator within `window` tokens is suppressed and penalised.
# -----------------------------------------------------------------------------
negation:
  window: 4
  markers:
    - "not"
    - "no"
    - "never"
    - "without"
    - "nor"
    - "n't"
    - "cannot"
    - "neither"
    - "unable to"
    - "free from"
    - "other than"

# -----------------------------------------------------------------------------
# FAMILY LEXICONS
# Grouped by contradiction TYPE rather than by pair, so the baseline has some
# ability to fire on a pair whose own cue list does not cover the phrasing.
# `applies_to_tests` restricts each family to the IR35 tests where it makes
# sense — "reimbursed" is evidence against a financial-risk answer and noise
# against a mutuality one.
# -----------------------------------------------------------------------------
families:

  reimbursement_flip:
