# -----------------------------------------------------------------------------
# STRUCTURAL REGEXES
# Where the contradiction is a shape rather than a word. The rate pattern is the
# clearest case: "fixed price for the project" answered alongside a day rate in
# the text is a category mismatch that no single keyword captures.
# -----------------------------------------------------------------------------
regexes:
  - id: day_rate_against_fixed_price
    applies_to_pairs: [p_4_16_payment_basis]
    only_when_answer_contains: "fixed"
    # Note the \[?AMOUNT\]? alternative: de-identification has already replaced
    # the figure with [AMOUNT] by the time any model sees the text, and the rate
    # basis is exactly what that masking was designed to preserve.
    pattern: '(?:\b(?:day|daily|hourly|weekly)\s+rate\b)|(?:per\s+(?:hour|day|week))|(?:\[?AMOUNT\]?\s*(?:per|a)\s+(?:hour|day|week))|(?:timesheet)'
    explanation: "the justification describes a time-based rate while the answer selects a fixed price"

  - id: fte_or_day_count
    applies_to_pairs: [p_4_30_majority_of_time]
    only_when_answer_contains: "No"
    pattern: '\b(?:0\.\d\s*fte|\d\s*days? a week|full[- ]time|five days)\b'
    explanation: "the justification describes a near-full-time commitment while the answer says this is not the majority of their time"

  - id: back_to_back_dates
    applies_to_pairs: [p_4_28_starts_immediately_after]
    only_when_answer_contains: "No"
    pattern: '\b(?:seamlessly|the day after|no break|immediately after|picks up in)\b'
    explanation: "the justification describes continuity while the answer denies a back-to-back start"
