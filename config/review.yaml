# =============================================================================
# PHASE 5 — REVIEWER INTERFACE CONFIGURATION
# =============================================================================
# Governs what the Streamlit reviewer app shows and how it shows it. Nothing
# in src/ui or src/review may hardcode a score threshold, a band label or a
# field name — this file, schema.yaml and contradiction_pairs.yaml are the only
# places those live. Pointing the interface at a re-tuned detector, or wording
# the reviewer guidance differently, is a config edit.
#
# WHY BANDS, NOT PERCENTAGES
# Phase 4's calibration check found the rule baseline overstates itself badly:
# it predicts ~0.46 where the true rate in that score range was ~0.11. Showing
# "46% confidence" to a reviewer would be showing them a number that is wrong
# by a factor of four. `confidence_bands` below convert a raw score into a
# label backed by what was actually observed for scores in that range during
# Phase 4 evaluation — a defensible rank, not a false precision.
#
# Bands are listed low-to-high; a score is placed in the highest band whose
# `min_score` it clears. A score below every band's `min_score` is not shown
# to the reviewer at all — below that point the detector found no evidence
# worth a person's time.
# =============================================================================

detectors:
  # Which detector variants the app offers, in menu order. Each name must
  # match a RuleBaseline/TfidfBaseline variant this app knows how to build —
  # see src/review/assess.py:build_detector(). The rule baseline needs no
  # fitting; the TF-IDF baseline is fitted on the synthetic corpus at app
  # start-up as a DEMONSTRATION convenience only (see phase5 report,
  # "what changes for real data" — production would load a persisted,
  # validated model artefact instead of fitting one in-process on launch).
  available:
    - rules_as_authored
    - rules_phrase_deleaked
    - tfidf_logreg
  default: rules_as_authored

  confidence_bands:
    rules_as_authored:
      - min_score: 0.3543   # Phase 4 chosen operating point (record split)
        label: "Worth a look"
        rationale: >-
          In testing, about 1 flag in 40 at this level turned out to be a
          genuine planted contradiction.
      - min_score: 0.42
        label: "Priority"
        rationale: >-
          In testing, about 1 flag in 9 at this level turned out to be a
          genuine planted contradiction — noticeably more often than the
          "Worth a look" band.
    rules_phrase_deleaked:
      # Same evidence surface, cues stripped of anything verbatim from the
      # Phase 0 text bank. Slightly more conservative in practice.
      - min_score: 0.30
        label: "Worth a look"
        rationale: >-
          A phrase fired that argues against the selected answer. This
          variant's cue list has anything copied word-for-word from the
          training text removed, so it leans on more general vocabulary.
      - min_score: 0.42
        label: "Priority"
        rationale: >-
          Multiple independent phrases fired, which in testing corresponded
          to a real contradiction noticeably more often than a single hit.
    tfidf_logreg:
      - min_score: 0.0726   # Phase 4 chosen operating point (record split)
        label: "Worth a look"
        rationale: >-
          In testing, about 1 flag in 34 at this level turned out to be a
          genuine planted contradiction.
      - min_score: 0.18
        label: "Priority"
        rationale: >-
          In testing, about 1 flag in 8 at this level turned out to be a
          genuine planted contradiction.
      - min_score: 0.60
        label: "High priority"
        rationale: >-
          Scores this high were rare in testing and, when they occurred,
          were almost always a genuine contradiction — but this comes from a
          small number of cases, so treat it as a strong hint, not a
          certainty.

  # A reminder shown next to every band, everywhere, so it survives being
  # read in isolation.
  band_disclaimer: >-
    This is a rank based on past testing, not a probability for this specific
    case. It tells you where to look first — it is not a measure of how
    likely this particular answer is to be wrong.

# -----------------------------------------------------------------------------
# Sample submissions offered in the app for demonstration, since there is no
# live feed of real ESQ submissions to paste from. Picked to show a spread:
# a clean record, a record with an obvious planted contradiction, and one
# with a subtle one. Record ids refer to data/synthetic/esq_synthetic_v1.jsonl.
# -----------------------------------------------------------------------------
sample_records:
  enabled: true
  n_offered: 12

# -----------------------------------------------------------------------------
# Reviewer decision capture. See src/review/decision_log.py.
# -----------------------------------------------------------------------------
decision_log:
  path: data/reviewer_decisions/decisions.jsonl
  # Same posture as constraint 4 (config/pipeline.yaml logging.log_content):
  # a reviewer's free-text reason is content, not metadata, and is redacted
  # to a digest by default. Flip only in an environment that has not seen a
  # real submission.
  log_reason_content: false
  reason_max_chars: 500

# -----------------------------------------------------------------------------
# Section labels for grouping flags on screen, keyed by IR35 test id from
# schema.yaml. Falls back to the test's own `label` if a test id is missing
# here, so adding a test to the schema without touching this file still works.
# -----------------------------------------------------------------------------
test_section_order:
  - office_holder
  - substitution
  - control
  - financial_risk
  - part_and_parcel
  - business_on_own_account
  - mutuality_of_obligation
  - contract_basis

# =============================================================================
# MATERIALITY — "how much does this typically matter," never "which way does
# this submission lean." See src/review/materiality.py for the safety
# argument in full; in short, every tier here is looked up purely from an
# IR35 test id or a field id — never from an answer, a score, or anything
# else that could vary between submissions, so this cannot become a status by
# another name.
#
# The three weight tiers and their cut-points are a direct restatement of the
# case-law hierarchy already documented in config/ir35_weights.yaml's own
# comments — personal service and control as the irreducible minimum,
# financial risk next, the rest as "all the circumstances" — not a new
# judgement invented for this file. The cut-points (0.25, 0.15) sit cleanly
# between the actual configured weights (0.28/0.26 | 0.22 | 0.10/0.09/0.05),
# so no test sits near a boundary.
# =============================================================================
materiality:
  tiers:
    - min_weight: 0.25
      label: "One of the two foundational tests"
      explanation: >-
        Case law treats personal service and control as the essential
        minimum for an employment relationship to exist at all. A mismatch
        here is worth checking carefully regardless of anything else on the
        form.
    - min_weight: 0.15
      label: "A major factor"
      explanation: >-
        Financial risk is weighted heavily in most determinations, though it
        is not treated as part of the essential minimum alongside personal
        service and control.
    - min_weight: 0.0
      label: "One of several contributing factors"
      explanation: >-
        Relevant to "all the circumstances" of the engagement, but not
        normally decisive on its own.

  # Applied instead of a weight tier when the specific field involved is part
  # of a determinative gate in config/ir35_weights.yaml (office holder, an
  # actual paid substitution, paying someone else for a significant portion
  # of the work) — a single fact case law treats as settling the question
  # regardless of every other answer on the form.
  gate_label: "Could be decisive on its own"
  gate_explanation: >-
    This answer is one of a small number of facts that case law treats as
    settling the question by itself, regardless of every other answer on the
    form — so if the written explanation turns out to be closer to the truth
    than the tick-box, that is worth flagging clearly rather than weighing
    against everything else.

# -----------------------------------------------------------------------------
# Tick-box vs tick-box consistency checks (src/models/cross_field.py).
# Severity is authored in contradiction_pairs.yaml per check, not computed —
# these are exact boolean rules, not statistical scores, so there is no
# calibration question to hedge with a band the way confidence_bands does
# above. Wording only, here.
# -----------------------------------------------------------------------------
cross_field:
  severity_label:
    low: "Low severity"
    medium: "Medium severity"
    high: "High severity"
  section_heading: "Do the tick-box answers agree with each other?"
  section_intro: >-
    These don't compare a tick-box against its own written explanation — they
    compare tick-boxes against each other. Some are data-quality issues (a
    question answered that the form's own routing should have skipped);
    others are two answers that don't sit well together on their face.

# =============================================================================
# Review priority (src/review/review_priority.py) — a 5-point scale
# summarising how much reviewer attention a submission's flags add up to,
# taken together.
#
# WHAT THIS IS NOT: it is not a Likert scale for "how likely is this
# engagement to be inside or outside IR35", and it must never be read or
# worded as one. It is an aggregate of information already shown elsewhere
# on the page — how many flags and findings there are, how strong the
# evidence for each is (its confidence band / severity), and how much that
# *kind* of mismatch typically matters (its materiality tier, gates
# overriding everything else, same as materiality.py) — collapsed into one
# number so a reviewer triaging many submissions can tell "needs a close
# look" from "nothing much here" without reading every card first. It says
# nothing about which way any answer leans, because none of its three
# inputs (count, evidence strength, importance-of-category) encode
# direction — the same property materiality.py's inputs have, extended to
# an aggregate. See docs/reports/phase7_consistency_and_materiality.md for
# the fuller discussion of why a per-submission status/lean was rejected
# and this was built instead.
#
# WHERE THE THRESHOLDS COME FROM: unlike confidence_bands above, there is no
# Phase 4-style calibration run behind these numbers — there is no ground
# truth for "how much combined attention a real submission deserves" to
# calibrate against, any more than there is for ir35_weights.yaml's test
# weights (that file's own comments make the same admission: "a
# transparent approximation ... not a statistically fitted model"). These
# are a starting, adjustable configuration, not a measured cut-point — the
# honest position is to say so here rather than imply a rigour that is not
# there.
# =============================================================================
review_priority:
  levels:
    - key: none
      label: "Nothing flagged"
      description: >-
        No inconsistencies were found among the tick-box/text pairs and
        tick-box/tick-box checks this tool runs. This is not the same as
        "outside IR35" — it means nothing checked here disagreed with
        itself, not that every relevant fact has been considered.
    - key: light
      label: "Light review"
      description: >-
        A small number of lower-stakes inconsistencies were found — worth a
        look, unlikely to need much time.
    - key: moderate
      label: "Moderate review"
      description: >-
        Several inconsistencies were found, or one touching a factor case
        law weighs fairly heavily.
    - key: close
      label: "Close review"
      description: >-
        A strong individual inconsistency was found on a foundational test,
        or several inconsistencies taken together add up to a similar
        amount of concern.
    - key: urgent
      label: "Urgent review"
      description: >-
        At least one inconsistency touches a fact case law treats as
        potentially decisive on its own (the same gates materiality.py
        flags as "could be decisive on its own") — worth checking before
        anything else on this submission.

  # How section-3/4 flags and findings are combined into one score, then
  # mapped to a level via `thresholds` below. Any item whose materiality is
  # a gate short-circuits straight to the "urgent" level, regardless of
  # score — the same override materiality.py already applies per-item,
  # applied here at the whole-submission level.
  scoring:
    band_weight:
      "Worth a look": 1
      "Priority": 2
      "High priority": 3
    cross_field_severity_weight:
      low: 1
      medium: 2
      high: 3
    materiality_weight:
      "One of several contributing factors": 1.0
      "A major factor": 1.5
      "One of the two foundational tests": 2.0
    # No entry needed for the gate tier — it overrides scoring entirely (see
    # above). An item with no materiality tier at all (e.g.
    # ir35_weights_config was not supplied) scores with a 1.0 multiplier.
    default_materiality_weight: 1.0
    thresholds:
      - key: close
        min_score: 6
      - key: moderate
        min_score: 3
      - key: light
        min_score: 0
