    role: outcome
  - id: ir35_outcome
    section: "For IR35 Team use only"
    label: "IR35 determination"
    type: structured
    cell: C319_or_C322    # two mutually exclusive statement blocks on the template
    pii_class: none
    role: outcome
    value_domain: ["inside", "outside"]
    value_labels:
      inside: "IR35 Applies - The worker is a deemed employee and will be paid via payroll."
      outside: >-
        IR35 does not apply - Engage the worker by raising a purchase order in
        line with the University's Purchasing Policy.
    note: >-
      The template has no dropdown here — the outcome is recorded by which of
      the two statement blocks is retained/ticked. The real-form adapter will
      need a rule for this. On synthetic data it is generated explicitly.
